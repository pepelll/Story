<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"ID";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf");font-weight:700}
@font-face{font-family:"ID";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf");font-weight:800}
@font-face{font-family:"ID";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf");font-weight:900}
@font-face{font-family:"ID";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf");font-weight:600}
@font-face{font-family:"ID";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf");font-weight:500}
@font-face{font-family:"ID";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Regular.otf");font-weight:400}
html,body{margin:0;padding:0;background:transparent;width:1672px;height:941px;overflow:hidden}
*{box-sizing:border-box}
body{font-family:"ID",sans-serif;position:relative;-webkit-font-smoothing:antialiased}
.abs{position:absolute}

/* ---------- pills ---------- */
.pill{display:flex;align-items:center;border-radius:36px;padding:0 22px 0 26px;gap:14px}
.pill .t{min-width:0;overflow:hidden;font-weight:800;letter-spacing:-0.02em;white-space:nowrap;flex:1;line-height:1}
.pillL{left:57px;top:83px;width:517px;height:124px;background:linear-gradient(180deg,#2b1f20,#231a1b);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.45)}
.pillL .t{color:#fff}
.pillR{left:1097px;top:83px;width:517px;height:124px;background:linear-gradient(180deg,#ffffff,#f4f4f4);
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pillR .t{color:#0b0b0b}
.tog{flex:none;width:100px;height:56px;border-radius:28px;position:relative}
.tog i{position:absolute;top:7px;width:42px;height:42px;border-radius:50%;background:#fff}
.togL{background:linear-gradient(180deg,#ff3b3b,#e01414);box-shadow:0 0 26px 6px rgba(255,30,30,.75),0 0 60px 14px rgba(255,20,20,.35)}
.togL i{left:9px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.togR{background:linear-gradient(180deg,#25d65a,#11b544);box-shadow:0 0 18px 2px rgba(30,210,90,.45)}
.togR i{right:9px;box-shadow:0 2px 4px rgba(0,0,0,.2)}

/* ---------- cards ---------- */
.card{border-radius:28px;overflow:hidden}
.cardL{left:65px;top:239px;width:497px;height:516px;
  background:linear-gradient(180deg,#d42a2a 0%,#b52123 28%,#7a1d1f 58%,#3e2224 85%,#352527 100%);
  box-shadow:0 0 40px rgba(255,40,40,.35),0 18px 40px rgba(0,0,0,.5)}
.cardR{left:1105px;top:240px;width:500px;height:515px;
  background:linear-gradient(180deg,#ffffff 0%,#f6fbf6 30%,#d9f3dc 70%,#b4e6bb 100%);
  box-shadow:0 0 34px rgba(80,230,120,.25),0 18px 40px rgba(0,0,0,.45)}

/* left list */
.list{position:absolute;left:22px;top:24px;width:418px}
.row{display:flex;align-items:center;height:80px;gap:14px;border-bottom:2px solid rgba(255,255,255,.22)}
.row:last-child{border-bottom:none}
.ico{flex:none;width:60px;height:60px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35)}
.ico img{width:100%;height:100%;display:block}
.name{color:#fff;font-weight:800;font-size:33px;letter-spacing:-0.02em;flex:1;white-space:nowrap}
.price{color:#fff;font-weight:800;font-size:34px;letter-spacing:-0.02em;white-space:nowrap;text-align:right}
.price small{font-size:26px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:0}
.price .from{font-size:25px;font-weight:700;color:rgba(255,255,255,.85);margin-right:5px}

.total{position:absolute;left:24px;top:376px;width:372px;height:110px;border-radius:22px;
  background:linear-gradient(180deg,#ff2d2d,#d81111);
  box-shadow:0 0 28px rgba(255,30,30,.55),inset 0 1px 0 rgba(255,255,255,.25);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 20px;color:#fff}
.total .l1{font-weight:800;font-size:29px;letter-spacing:.06em;opacity:.92;display:flex;align-items:center;gap:8px}
.total .l2{font-weight:900;font-size:52px;letter-spacing:-0.03em;line-height:1;margin-top:4px;white-space:nowrap}
.total .l2 small{font-size:30px;font-weight:800;letter-spacing:-0.01em}

/* right card */
.allof{position:absolute;left:32px;top:16px;font-size:44px;font-weight:600;color:#111;letter-spacing:-0.01em}
.zero{position:absolute;left:44px;top:74px;display:flex;align-items:center;gap:12px}
.zero .num{font-weight:900;font-size:192px;line-height:1;letter-spacing:-0.04em;color:#050505;position:relative;
  text-shadow:0 0 30px rgba(40,220,90,.55),0 0 70px rgba(40,220,90,.35)}
.glow{position:absolute;left:-10px;top:50px;width:330px;height:250px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(60,235,110,.55),rgba(60,235,110,0))}
.free{background:linear-gradient(180deg,#2fd864,#14b545);color:#fff;font-weight:900;font-size:50px;letter-spacing:.01em;
  padding:10px 20px 12px;border-radius:18px;line-height:1;box-shadow:0 0 26px rgba(30,210,90,.6);transform:rotate(-4deg)}
.icons{position:absolute;right:30px;top:316px;display:flex;gap:16px}
.icons .ico{width:72px;height:72px;border-radius:18px;position:relative;overflow:visible}
.icons .ico img{border-radius:17px}
.icons .ck{position:absolute;right:-10px;bottom:-10px;width:32px;height:32px;border-radius:50%;background:#16c04b;
  border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.btn{position:absolute;right:28px;top:420px;width:330px;height:68px;border-radius:16px;
  background:linear-gradient(180deg,#3bd35a,#21b33f);color:#fff;font-weight:800;font-size:38px;letter-spacing:-0.01em;
  display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 18px rgba(20,160,60,.35),inset 0 1px 0 rgba(255,255,255,.3)}
</style></head>
<body>

<!-- LEFT PILL -->
<div class="abs pill pillL"><div class="t fit" data-max="64">Paid services</div><div class="tog togL"><i></i></div></div>
<!-- RIGHT PILL -->
<div class="abs pill pillR"><div class="t fit" data-max="64">blofin.perpetuas.io</div><div class="tog togR"><i></i></div></div>

<!-- LEFT CARD -->
<div class="abs card cardL">
  <div class="list">
    <div class="row"><div class="ico" style="background:#131722"><img src="icons/tradingview_tile.svg"></div><div class="name">TradingView</div><div class="price">$60<small>/mo</small></div></div>
    <div class="row"><div class="ico" style="background:#eb9b3b"><img src="icons/tokenomist.png"></div><div class="name">Tokenomist</div><div class="price">$69<small>/mo</small></div></div>
    <div class="row"><div class="ico" style="background:#5f6ae5"><img src="icons/defillama.png"></div><div class="name">DefiLlama</div><div class="price">$41<small>/mo</small></div></div>
    <div class="row"><div class="ico" style="background:#1b1a1a"><img src="icons/coinglass.png"></div><div class="name">CoinGlass</div><div class="price"><span class="from">from</span>$23<small>/mo</small></div></div>
  </div>
  <div class="total">
    <div class="l1">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 4v14M5 12l7 7 7-7" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      TOTAL</div>
    <div class="l2">≈ $2,300<small> / year</small></div>
  </div>
</div>

<!-- RIGHT CARD -->
<div class="abs card cardR">
  <div class="glow"></div>
  <div class="allof">All of this</div>
  <div class="zero"><div class="num">$0</div><div class="free">FREE</div></div>
  <div class="icons">
    <div class="ico" style="background:#131722"><img src="icons/tradingview_tile.svg"><div class="ck"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <div class="ico" style="background:#eb9b3b"><img src="icons/tokenomist.png"><div class="ck"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <div class="ico" style="background:#5f6ae5"><img src="icons/defillama.png"><div class="ck"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <div class="ico" style="background:#1b1a1a"><img src="icons/coinglass.png"><div class="ck"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  </div>
  <div class="btn">Included free</div>
</div>

<script>
document.querySelectorAll('.fit').forEach(el=>{
  let s=+el.dataset.max; el.style.fontSize=s+'px';
  while(el.scrollWidth>el.clientWidth && s>20){s-=1;el.style.fontSize=s+'px'}
  el.dataset.final=s;
});
</script>
</body></html>
